<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Completion | LearnCo</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<main class="certificate-page">
<section class="certificate" aria-labelledby="certificate-title">


<p class="certificate-brand">LearnCo</p>
<h1 id="certificate-title">Certificate of Completion</h1>


<p class="certificate-intro">This certificate is proudly presented to</p>


<h2 id="studentName">
Student Name
</h2>


<p>
For successfully completing the course
</p>


<h2 id="courseName">
Course Name
</h2>


<p class="certificate-congratulations">Congratulations on your achievement!</p>


<p>
Date:
<span id="date"></span>
</p>

</section>

<div class="certificate-actions">
    <button type="button" class="btn btn-accent" onclick="window.print()">
        Download Certificate
    </button>
    <p>In the print window, choose <strong>Save as PDF</strong> to download your certificate.</p>
</div>
</main>

<script src="js/certificate.js"></script>


</body>

</html>
